# Local single-player endpoint override for the Boom/RuneLite client.
# This file is injected by patch-client-local.sh into net/runelite/client/runelite.properties.

runelite.enable_local=true
runelite.enable_test=false
runelite.js5_ip=127.0.0.1
runelite.js5_port=43594

# Keep revision-239 local configuration explicit. A later milestone will replace this
# with a local HTTP endpoint once the exact jav_config payload is captured.
runelite.jav_config=http://127.0.0.1:8080/jav_config.ws
runelite.jav_config_local=http://127.0.0.1:8080/jav_config.ws
runelite.jav_config_test=http://127.0.0.1:8080/jav_config.ws
runelite.jav_config_backup=http://127.0.0.1:8080/jav_config.ws

# Preserve the inspected client's RSA values until the local login protocol is implemented.
runelite.rsa.exponent=10001
runelite.rsa.

runelite.title=BoomPS Local Singleplayer
runelite.version=1.12.31.1
runelite.commit=local-singleplayer
runelite.dirty=true

# Retain RuneLite services for now; they are not part of the game/login authority.
runelite.pluginhub.url=https://repo.runelite.net/plugins
runelite.pluginhub.version=1.12.31.1
runelite.api.base=https://api.runelite.net/runelite-1.12.31.1
runelite.session=https://api.runelite.net/session
runelite.static.base=https://static.runelite.net
runelite.ws=https://api.runelite.net/ws2
runelite.config=https://static.runelite.net/config.json
runelite.oauth.redirect=https://runelite.net/logged-in
runelite.wiki.troubleshooting.link=https://github.com/runelite/runelite/wiki/Troubleshooting-problems-with-the-client
runelite.wiki.building.link=https://github.com/runelite/runelite/wiki/Building-with-IntelliJ-IDEA#client-failing-to-start
runelite.dnschange.link=https://1.1.1.1/dns/#setup-instructions
runelite.jagex.domainblock=.discord.com,.runescape.wiki

# Disable Boom-specific community integration in the local experiment.
runelite.discord.enable=false
runelite.discord.invite=
runelite.github.link=
runelite.wiki.link=
runelite.patreon.link=
runelite.osrstwitter.link=
