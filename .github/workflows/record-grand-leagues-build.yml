name: Record Grand Leagues APK result

on:
  workflow_run:
    workflows: ['Build self-contained Grand Leagues APK']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grand-leagues-self-contained
      - name: Record result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p build/grandleague
          cat > build/grandleague/build.result <<EOF
          run_id=$RUN_ID
          run_number=$RUN_NUMBER
          conclusion=$CONCLUSION
          head_sha=$HEAD_SHA
          run_url=$RUN_URL
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build/grandleague/build.result
          git commit -m 'Record Grand Leagues APK build result' || exit 0
          git push origin HEAD:grand-leagues-self-contained
