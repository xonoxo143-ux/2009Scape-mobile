name: Dispatch final Grand Leagues APK v2

on:
  push:
    branches: [grand-leagues-self-contained]
    paths:
      - '.github/workflows/dispatch-grand-leagues-final-v2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches \
            -f ref=grand-leagues-self-contained
