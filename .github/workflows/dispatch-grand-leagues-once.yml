name: Dispatch Grand Leagues APK once

on:
  push:
    branches: [grand-leagues-self-contained]
    paths:
      - '.github/workflows/dispatch-grand-leagues-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch self-contained APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches \
            -f ref=grand-leagues-self-contained
