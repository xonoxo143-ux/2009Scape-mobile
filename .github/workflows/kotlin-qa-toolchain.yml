name: Kotlin QA Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - local-server-spike
    paths:
      - '.github/workflows/kotlin-qa-toolchain.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4

      - name: Publish run id
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci
          printf 'run_id=%s\nsha=%s\n' '${{ github.run_id }}' '${{ github.sha }}' > ci/kotlin-qa-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/kotlin-qa-run-id.txt
          git commit -m 'Record Kotlin QA toolchain run id' || true
          git push origin HEAD:local-server-spike

      - name: Download pinned Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            --output kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.8.20/kotlin-compiler-1.8.20.zip
          sha256sum kotlin-compiler.zip | tee kotlin-compiler.sha256
          unzip -q kotlin-compiler.zip -d kotlin-qa
          kotlin-qa/kotlinc/bin/kotlinc -version

      - name: Upload verified compiler
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compiler-1.8.20
          path: |
            kotlin-qa/kotlinc
            kotlin-compiler.sha256
          if-no-files-found: error
          retention-days: 14
