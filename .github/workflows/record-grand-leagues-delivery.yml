name: Record Grand Leagues APK Delivery

on:
  workflow_run:
    workflows:
      - Deliver Grand Leagues APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Record result and failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/grandleague
          cat > build/grandleague/delivery.result <<EOF
          run_id=$RUN_ID
          run_number=$RUN_NUMBER
          conclusion=$CONCLUSION
          head_sha=$HEAD_SHA
          run_url=$RUN_URL
          EOF
          if [[ "$CONCLUSION" != "success" ]]; then
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > build/grandleague/delivery-failure.log 2>&1 || true
          else
            rm -f build/grandleague/delivery-failure.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build/grandleague/delivery.result build/grandleague/delivery-failure.log 2>/dev/null || git add build/grandleague/delivery.result
          git commit -m "Record Grand Leagues APK delivery run $RUN_ID: $CONCLUSION" || exit 0
          git push origin HEAD:master
