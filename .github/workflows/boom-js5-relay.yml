name: Probe Boom startup through localhost JS5 relay

on:
  workflow_dispatch:
  push:
    branches: [boom-singleplayer-pivot]
    paths:
      - .github/workflows/boom-js5-relay.yml
      - boom-migration/js5_proxy.py
      - boom-migration/patch_local_properties.py

jobs:
  relay-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare redirected Boom client
        run: |
          set -euxo pipefail
          mkdir -p probe/web probe/logs probe/relay probe/home
          curl -fL --retry 3 https://boom-ps.com/download/files/client-boomps.jar -o probe/client-boomps.jar
          curl -fL --retry 3 https://boom-ps.com/integrations/jav_config.ws -o probe/official-jav_config.ws
          python3 boom-migration/patch_local_properties.py probe/client-boomps.jar probe/client-local.jar --host 127.0.0.1 --port 43594 > probe/logs/patched-properties.txt
          python3 - <<'PY'
          from pathlib import Path
          src = Path('probe/official-jav_config.ws').read_text()
          out = []
          for line in src.splitlines():
              if line.startswith('codebase='):
                  line = 'codebase=http://127.0.0.1:18080/'
              line = line.replace('world1.boom-ps.com', '127.0.0.1')
              out.append(line)
          Path('probe/web/jav_config.ws').write_text('\n'.join(out) + '\n')
          PY

      - name: Start localhost config and JS5 relay
        run: |
          set -euxo pipefail
          nohup python3 -m http.server 18080 --bind 127.0.0.1 --directory probe/web > probe/logs/http.log 2>&1 & echo $! > probe/http.pid
          nohup python3 boom-migration/js5_proxy.py --out probe/relay > probe/logs/relay.log 2>&1 & echo $! > probe/relay.pid
          sleep 2
          cat probe/logs/relay.log

      - name: Launch client and capture initialized state
        env:
          HOME: ${{ github.workspace }}/probe/home
          DISPLAY: :99
        run: |
          set +e
          Xvfb :99 -screen 0 1280x800x24 > probe/logs/xvfb.log 2>&1 & echo $! > probe/xvfb.pid
          sleep 2
          java -ea -Duser.home="$HOME" -Xmx768m -Xss2m -XX:CompileThreshold=1500 \
            -jar probe/client-local.jar \
            --noupdate \
            --disable-telemetry \
            --safe-mode \
            --debug \
            --jav_config http://127.0.0.1:18080/jav_config.ws \
            > probe/logs/client.log 2>&1 &
          echo $! > probe/client.pid
          sleep 25
          if command -v import >/dev/null 2>&1; then
            import -display :99 -window root probe/screen.png || true
          fi
          kill $(cat probe/client.pid) 2>/dev/null || true
          sleep 2
          exit 0

      - name: Summarize relay and local cache
        run: |
          set -euxo pipefail
          echo '=== RELAY ===' | tee probe/logs/summary.txt
          cat probe/logs/relay.log | tee -a probe/logs/summary.txt || true
          echo '=== CLIENT IMPORTANT ===' | tee -a probe/logs/summary.txt
          grep -Ei 'error_game|js5|game state|login|loaded|cache|127\.0\.0\.1|239|user.home' probe/logs/client.log | tail -250 | tee -a probe/logs/summary.txt || true
          echo '=== JAVA HOME ===' | tee -a probe/logs/summary.txt
          printf 'forced_user_home=%s\n' "${{ github.workspace }}/probe/home" | tee -a probe/logs/summary.txt
          echo '=== LOCAL FILE TREE ===' | tee -a probe/logs/summary.txt
          find probe/home -type f -printf '%s %p\n' | sort -nr | head -600 | tee probe/logs/home-files.txt | tee -a probe/logs/summary.txt || true
          echo '=== CACHE SUMMARY ===' | tee -a probe/logs/summary.txt
          python3 - <<'PY' | tee probe/logs/cache-summary.txt | tee -a probe/logs/summary.txt
          from pathlib import Path
          root = Path('probe/home')
          files = [p for p in root.rglob('*') if p.is_file()]
          print('file_count=', len(files))
          print('total_bytes=', sum(p.stat().st_size for p in files))
          for d in sorted({p.parent for p in files}, key=str):
              rel = d.relative_to(root)
              ds = [p for p in files if p.parent == d]
              size = sum(p.stat().st_size for p in ds)
              if size or any(k in str(rel).lower() for k in ('jagex', 'boom', 'runelite', 'cache')):
                  print(f'dir={rel} files={len(ds)} bytes={size}')
          PY
          echo '=== RELAY BYTE TOTALS ===' | tee -a probe/logs/summary.txt
          python3 - <<'PY' | tee -a probe/logs/summary.txt
          from pathlib import Path
          root = Path('probe/relay')
          for direction in ('client-to-server', 'server-to-client'):
              fs = list(root.glob(f'*-{direction}.bin'))
              print(direction, 'connections=', len(fs), 'bytes=', sum(p.stat().st_size for p in fs))
          PY

      - name: Upload non-cache diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: boom-js5-relay-report
          path: |
            probe/logs/**
            probe/screen.png
            probe/relay/*.log
            probe/official-jav_config.ws
            probe/web/jav_config.ws
          if-no-files-found: warn
          retention-days: 3
