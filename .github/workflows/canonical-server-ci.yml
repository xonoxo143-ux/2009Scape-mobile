name: Grand Leagues Canonical Server

on:
  workflow_dispatch:
  push:
    branches:
      - grand-leagues-canonical
    paths:
      - 'vendor/2009scape/Server/**'
      - 'qa/grandleague/**'
      - '.github/workflows/canonical-server-ci.yml'

concurrency:
  group: grand-leagues-canonical-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish run id
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci
          printf 'run_id=%s\nsha=%s\n' '${{ github.run_id }}' '${{ github.sha }}' > ci/canonical-server-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/canonical-server-run-id.txt
          git commit -m 'Record canonical server run id' || true
          git pull --rebase origin grand-leagues-canonical
          git push origin HEAD:grand-leagues-canonical

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: vendor/2009scape/Server/pom.xml

      - name: Run dependency-free Grand Leagues gate
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v1.8.20/kotlin-compiler-1.8.20.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          export PATH="$RUNNER_TEMP/kotlin/kotlinc/bin:$PATH"
          kotlinc -version
          bash qa/grandleague/run.sh

      - name: Compile the complete server
        shell: bash
        run: |
          set -euxo pipefail
          cd vendor/2009scape/Server
          ./mvnw -B -ntp -DskipTests clean package
          JAR="$(find target -maxdepth 1 -type f -name '*jar-with-dependencies*.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'content/global/leagues/core/GrandLeagueSession.class'
          jar tf "$JAR" | grep -q 'content/global/leagues/core/LeagueLethalHitResult.class'
          cp "$JAR" "$GITHUB_WORKSPACE/canonical-server.jar"

      - name: Upload compiled server proof
        uses: actions/upload-artifact@v4
        with:
          name: grand-leagues-canonical-server
          path: canonical-server.jar
          if-no-files-found: error
          retention-days: 14
