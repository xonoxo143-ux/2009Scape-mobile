name: Probe BoomPS localhost handshake

on:
  workflow_dispatch:
  push:
    branches: [boom-local-singleplayer]
    paths:
      - '.github/workflows/boom-local-js5.yml'
      - 'boom-local/**'

permissions:
  contents: read

jobs:
  local-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openjdk-17-jre-headless

      - name: Download Boom client
        run: |
          mkdir -p boom-local/js5-report boom-local/work
          curl -fL --retry 3 https://boom-ps.com/download/files/client-boomps.jar -o boom-local/work/client-boomps.jar
          sha256sum boom-local/work/client-boomps.jar | tee boom-local/js5-report/client.sha256

      - name: Build localhost jav_config
        run: |
          curl -fL --retry 3 https://boom-ps.com/integrations/jav_config.ws -o boom-local/jav_config.remote.ws
          python3 - <<'PY'
          from pathlib import Path
          src = Path('boom-local/jav_config.remote.ws').read_text(errors='replace')
          out=[]
          for line in src.splitlines():
              if line.startswith('codebase='):
                  line='codebase=http://127.0.0.1:8080/'
              line=line.replace('world1.boom-ps.com','127.0.0.1')
              out.append(line)
          Path('boom-local/jav_config.local.ws').write_text('\n'.join(out)+'\n')
          PY
          cp boom-local/jav_config.local.ws boom-local/js5-report/

      - name: Patch Boom client endpoints to localhost
        run: |
          chmod +x boom-local/patch-client-local.sh
          boom-local/patch-client-local.sh boom-local/work/client-boomps.jar
          unzip -p boom-local/work/client-boomps-local.jar net/runelite/client/runelite.properties \
            | grep -E 'js5|jav_config|enable_local|title|version' \
            | tee boom-local/js5-report/patched-properties.txt

      - name: Start local HTTP and TCP protocol probe
        run: |
          python3 boom-local/probe_local_boot.py > boom-local/js5-report/probe-process.log 2>&1 &
          echo $! > boom-local/js5-report/probe.pid
          sleep 2

      - name: Launch patched Boom client
        continue-on-error: true
        run: |
          set +e
          timeout 45s xvfb-run -a java -Xmx768m -Xss2m -XX:CompileThreshold=1500 \
            -cp boom-local/work/client-boomps-local.jar net.runelite.client.RuneLite --debug \
            > boom-local/js5-report/local-client.log 2>&1
          echo $? > boom-local/js5-report/local-client.exit
          set -e
          sleep 3

      - name: Collect probe output
        if: always()
        run: |
          cp boom-local/probe-output/* boom-local/js5-report/ 2>/dev/null || true
          echo '=== TCP HANDSHAKE ==='
          cat boom-local/js5-report/tcp-connections.log 2>/dev/null || true
          echo '=== HTTP REQUESTS ==='
          cat boom-local/js5-report/http-requests.log 2>/dev/null || true
          echo '=== CLIENT STATE ==='
          grep -Ei 'js5|cache|loading|login|game state|error|exception|connect' boom-local/js5-report/local-client.log 2>/dev/null | tail -300 || true
          echo '=== CLIENT TAIL ==='
          tail -150 boom-local/js5-report/local-client.log 2>/dev/null || true

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boom-local-js5-report
          path: boom-local/js5-report/**
          retention-days: 3
