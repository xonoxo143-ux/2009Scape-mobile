name: Native Refactor Checks

on:
  push:
    branches:
      - singleplayer-native-refactor
    paths:
      - '.github/ci-trigger'

concurrency:
  group: native-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile local runtime authority and RT4 patch source set
        run: |
          set -euxo pipefail
          rm -rf build/native-bootstrap build/generated-rt4
          mkdir -p build/native-bootstrap build/generated-rt4/rt4
          python3 singleplayer/native-refactor/prepare_rt4_movement.py \
            build/generated-rt4/rt4/PathFinder.java
          mapfile -t RT4_PATCHES < <(find singleplayer/client-patches/rt4 -maxdepth 1 -type f -name '*.java' | sort)
          test "${#RT4_PATCHES[@]}" -ge 7
          printf 'RT4 patch source: %s\n' "${RT4_PATCHES[@]}"
          javac --release 17 \
            -cp app_pojavlauncher/src/main/assets/rt4.jar \
            -d build/native-bootstrap \
            singleplayer/inprocess/InProcessBootstrap.java \
            singleplayer/inprocess/MobileGestureBridge.java \
            singleplayer/inprocess/MobileLifecycleBridge.java \
            "${RT4_PATCHES[@]}" \
            build/generated-rt4/rt4/PathFinder.java
          test -f build/native-bootstrap/singleplayer/LocalGameRuntime.class
          test -f build/native-bootstrap/singleplayer/GameConfig.class
          test -f build/native-bootstrap/singleplayer/InProcessBootstrap\$LocalCommands.class
          test -f build/native-bootstrap/rt4/ClientProt.class
          test -f build/native-bootstrap/rt4/PathFinder.class
          grep -q 'WORLDSPACE_WALK_DIRECT' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'INTERACT_WALK_DIRECT' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'MINIMAP_WALK_DIRECT' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'consumeDirectMinimapWalk' build/generated-rt4/rt4/PathFinder.java

      - name: Fetch pinned 2009Scape source
        run: |
          set -euxo pipefail
          UPSTREAM_COMMIT=9f634148bab11fad821943864cb71d7c6af98da4
          git init upstream-server
          git -C upstream-server remote add origin https://gitlab.com/2009scape/2009scape.git
          git -C upstream-server fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream-server checkout --detach FETCH_HEAD
          test "$(git -C upstream-server rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply shadow-only migration overlay
        run: |
          set -euxo pipefail
          python3 singleplayer/native-refactor/prepare_upstream.py \
            upstream-server/Server \
            --repo-root "$GITHUB_WORKSPACE"
          grep -q 'LocalMigrationProbe.observeIncoming' \
            upstream-server/Server/src/main/core/net/packet/PacketProcessor.kt
          grep -q 'LocalMigrationProbe.observeOutgoing' \
            upstream-server/Server/src/main/core/net/packet/PacketRepository.java
          grep -q '127.0.0.1' \
            upstream-server/Server/src/main/core/net/NioReactor.java

      - name: Build retained world engine
        working-directory: upstream-server/Server
        run: |
          set -euxo pipefail
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Verify direct typed command bridge
        run: |
          set -euxo pipefail
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \
            \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) \
            | head -n 1)
          test -n "$ENGINE_JAR"
          jar -tf "$ENGINE_JAR" | grep -q 'core/local/LocalMigrationProbe.class'

          cat > build/NativeBridgeSmoke.java <<'JAVA'
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;

          public final class NativeBridgeSmoke {
              public static void main(String[] args) throws Exception {
                  System.setProperty("singleplayer.viewDistance", "40");

                  Class<?> bootstrap = Class.forName("singleplayer.InProcessBootstrap");
                  Method worldScale = bootstrap.getDeclaredMethod(
                          "applyWorldViewDistance", int.class);
                  Method clientScale = bootstrap.getDeclaredMethod(
                          "applyClientViewDistance", int.class);
                  worldScale.setAccessible(true);
                  clientScale.setAccessible(true);
                  worldScale.invoke(null, 40);
                  clientScale.invoke(null, 40);

                  int world = core.game.world.map.MapDistance.RENDERING.getDistance();
                  int client = rt4.GlobalConfig.TILE_DISTANCE;
                  if (world != 40 || client != 40 || world != client) {
                      throw new AssertionError(
                              "authority mismatch world=" + world + " client=" + client);
                  }

                  Class<?> player = Class.forName(
                          "core.game.node.entity.player.Player");
                  requireCommand("WorldspaceWalk",
                          player, int.class, int.class, boolean.class);
                  requireCommand("InteractWalk",
                          player, int.class, int.class, boolean.class);
                  requireCommand("MinimapWalk",
                          player, int.class, int.class, int.class,
                          int.class, int.class, boolean.class);
                  requireCommand("NpcAction", player, int.class, int.class);
                  requireCommand("SceneryAction",
                          player, int.class, int.class, int.class, int.class);
                  requireCommand("ItemAction",
                          player, int.class, int.class, int.class, int.class, int.class);
                  requireCommand("IfAction",
                          player, int.class, int.class, int.class,
                          int.class, int.class, int.class);

                  if (!singleplayer.InProcessBootstrap.LocalCommands.isAvailable()) {
                      throw new AssertionError("direct local command bridge unavailable");
                  }

                  System.out.println(
                          "NATIVE_REFACTOR: VIEW_DISTANCE=" + world +
                          " DIRECT_COMMAND_TYPES=READY MOVEMENT_CUTOVER=COMPILED");
              }

              private static void requireCommand(
                      String name, Class<?>... signature) throws Exception {
                  Class<?> type = Class.forName(
                          "core.net.packet.in.Packet$" + name);
                  Constructor<?> constructor = type.getConstructor(signature);
                  if (constructor == null) {
                      throw new AssertionError("missing command " + name);
                  }
              }
          }
          JAVA

          javac --release 17 \
            -cp build/native-bootstrap:app_pojavlauncher/src/main/assets/rt4.jar:"$ENGINE_JAR" \
            -d build/native-bootstrap build/NativeBridgeSmoke.java
          java \
            -cp build/native-bootstrap:app_pojavlauncher/src/main/assets/rt4.jar:"$ENGINE_JAR" \
            NativeBridgeSmoke

      - name: Verify shadow observation boundary
        run: |
          set -euxo pipefail
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \
            \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) \
            | head -n 1)
          javap -classpath "$ENGINE_JAR" core.local.LocalMigrationProbe \
            | tee build/local-migration-probe.txt
          grep -q 'observeIncoming' build/local-migration-probe.txt
          grep -q 'observeOutgoing' build/local-migration-probe.txt

      - name: Architecture checkpoint summary
        run: |
          echo 'One LocalGameRuntime authority: compiled'
          echo 'One view-distance value drives retained world + RT4: verified'
          echo 'Existing typed 2009Scape commands reachable without TCP: verified'
          echo 'RT4 migration patches compile as independent source files: verified'
          echo 'World, interaction, and minimap walking cut over to direct typed commands: compiled'
          echo 'Incoming/outgoing legacy boundaries observable for parity migration: verified'
