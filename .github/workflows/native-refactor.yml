name: Native Refactor Checks

on:
  push:
    branches:
      - singleplayer-native-refactor
    paths:
      - '.github/ci-trigger'

concurrency:
  group: native-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate pinned RT4 source overrides
        run: |
          set -euxo pipefail
          rm -rf build/generated-rt4
          python3 singleplayer/native-refactor/prepare_rt4.py build/generated-rt4
          test -f build/generated-rt4/rt4/SignLink.java
          grep -q 'LocalSocketPolicy.openJs5IfRequested' build/generated-rt4/rt4/SignLink.java

      - name: Compile local runtime authority and RT4 patch source set
        run: |
          set -euxo pipefail
          rm -rf build/native-bootstrap
          mkdir -p build/native-bootstrap
          mapfile -t RT4_PATCHES < <(find singleplayer/client-patches/rt4 -maxdepth 1 -type f -name '*.java' | sort)
          test "${#RT4_PATCHES[@]}" -ge 7
          printf 'RT4 patch source: %s\n' "${RT4_PATCHES[@]}"
          javac --release 17 \
            -cp app_pojavlauncher/src/main/assets/rt4.jar \
            -d build/native-bootstrap \
            singleplayer/inprocess/InProcessBootstrap.java \
            singleplayer/inprocess/SinglePlayerDebug.java \
            singleplayer/inprocess/MobileGestureBridge.java \
            singleplayer/inprocess/MobileLifecycleBridge.java \
            "${RT4_PATCHES[@]}" \
            build/generated-rt4/rt4/SignLink.java
          test -f build/native-bootstrap/singleplayer/LocalGameRuntime.class
          test -f build/native-bootstrap/singleplayer/GameConfig.class
          test -f build/native-bootstrap/singleplayer/InProcessBootstrap\$LocalCommands.class
          test -f build/native-bootstrap/singleplayer/SinglePlayerDebug.class
          test -f build/native-bootstrap/rt4/ClientProt.class
          test -f build/native-bootstrap/rt4/SignLink.class
          test -f build/native-bootstrap/rt4/LocalJs5Socket.class
          test -f build/native-bootstrap/rt4/LocalSocketPolicy.class
          test -f build/native-bootstrap/rt4/LocalLoginBridge.class
          test -f build/native-bootstrap/rt4/LocalPresentationBridge.class
          test -f build/native-bootstrap/rt4/LocalLeagueBridge.class
          grep -q 'LocalCommands.worldspaceWalk' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'LocalCommands.interactWalk' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'LocalCommands.minimapWalk' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'markDirectMinimapTrailer' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'stripDirectMinimapTrailers' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'MINIMAP_TRAILERS_DISCARDED' singleplayer/client-patches/rt4/ClientProt.java
          grep -q 'LocalLoginBridge.tickAutoLogin' singleplayer/client-patches/rt4/NanoTimer.java

      - name: Fetch pinned 2009Scape source
        run: |
          set -euxo pipefail
          UPSTREAM_COMMIT=9f634148bab11fad821943864cb71d7c6af98da4
          git init upstream-server
          git -C upstream-server remote add origin https://gitlab.com/2009scape/2009scape.git
          git -C upstream-server fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream-server checkout --detach FETCH_HEAD
          test "$(git -C upstream-server rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply canonical single-player migration overlay
        run: |
          set -euxo pipefail
          python3 singleplayer/native-refactor/prepare_upstream.py \
            upstream-server/Server \
            --repo-root "$GITHUB_WORKSPACE"
          grep -q 'LocalMigrationProbe.observeIncoming' \
            upstream-server/Server/src/main/core/net/packet/PacketProcessor.kt
          grep -q 'LocalMigrationProbe.observeOutgoing' \
            upstream-server/Server/src/main/core/net/packet/PacketRepository.java
          grep -q 'beginLocalLogin' \
            upstream-server/Server/src/main/core/local/LocalMigrationProbe.kt
          grep -q 'ENTITY_SYNC_DISTANCE = 15' \
            upstream-server/Server/src/main/core/local/LocalMigrationProbe.kt
          grep -q 'object LeagueRuntime' \
            upstream-server/Server/src/main/core/local/LocalMigrationProbe.kt

      - name: Build retained world engine
        working-directory: upstream-server/Server
        run: |
          set -euxo pipefail
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Verify direct typed command and distance boundaries
        run: |
          set -euxo pipefail
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \
            \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) \
            | head -n 1)
          test -n "$ENGINE_JAR"
          jar -tf "$ENGINE_JAR" | grep -q 'core/local/LocalMigrationProbe.class'
          jar -tf "$ENGINE_JAR" | grep -q 'core/local/LeagueRuntime.class'
          jar -tf "$ENGINE_JAR" | grep -q 'core/storage/LocalFileStorageProvider.class'

          cat > build/NativeBridgeSmoke.java <<'JAVA'
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;

          public final class NativeBridgeSmoke {
              public static void main(String[] args) throws Exception {
                  System.setProperty("singleplayer.viewDistance", "40");

                  Class<?> bootstrap = Class.forName("singleplayer.InProcessBootstrap");
                  Method clientScale = bootstrap.getDeclaredMethod(
                          "applyClientViewDistance", int.class);
                  clientScale.setAccessible(true);
                  clientScale.invoke(null, 40);

                  int entitySync = core.game.world.map.MapDistance.RENDERING.getDistance();
                  int clientView = rt4.GlobalConfig.TILE_DISTANCE;
                  if (entitySync != 15) {
                      throw new AssertionError(
                              "retained entity sync radius must remain 15, got " + entitySync);
                  }
                  if (clientView != 40) {
                      throw new AssertionError(
                              "client view distance mismatch, got " + clientView);
                  }

                  Class<?> player = Class.forName(
                          "core.game.node.entity.player.Player");
                  requireCommand("WorldspaceWalk",
                          player, int.class, int.class, boolean.class);
                  requireCommand("InteractWalk",
                          player, int.class, int.class, boolean.class);
                  requireCommand("MinimapWalk",
                          player, int.class, int.class, int.class,
                          int.class, int.class, boolean.class);
                  requireCommand("NpcAction", player, int.class, int.class);
                  requireCommand("SceneryAction",
                          player, int.class, int.class, int.class, int.class);
                  requireCommand("ItemAction",
                          player, int.class, int.class, int.class, int.class, int.class);
                  requireCommand("IfAction",
                          player, int.class, int.class, int.class,
                          int.class, int.class, int.class);

                  if (!singleplayer.InProcessBootstrap.LocalCommands.isAvailable()) {
                      throw new AssertionError("direct local command bridge unavailable");
                  }

                  Class.forName("core.local.LeagueRuntime");
                  Class.forName("core.storage.LocalFileStorageProvider");
                  Class.forName("rt4.LocalLeagueBridge");

                  System.out.println(
                          "NATIVE_REFACTOR: CLIENT_VIEW=" + clientView +
                          " ENTITY_SYNC=" + entitySync +
                          " DIRECT_COMMAND_TYPES=READY LEAGUE_RUNTIME=READY ACCOUNT_STORE=READY");
              }

              private static void requireCommand(
                      String name, Class<?>... signature) throws Exception {
                  Class<?> type = Class.forName(
                          "core.net.packet.in.Packet$" + name);
                  Constructor<?> constructor = type.getConstructor(signature);
                  if (constructor == null) {
                      throw new AssertionError("missing command " + name);
                  }
              }
          }
          JAVA

          javac --release 17 \
            -cp build/native-bootstrap:app_pojavlauncher/src/main/assets/rt4.jar:"$ENGINE_JAR" \
            -d build/native-bootstrap build/NativeBridgeSmoke.java
          java \
            -cp build/native-bootstrap:app_pojavlauncher/src/main/assets/rt4.jar:"$ENGINE_JAR" \
            NativeBridgeSmoke

      - name: Verify migration and league boundaries
        run: |
          set -euxo pipefail
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \
            \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) \
            | head -n 1)
          javap -classpath "$ENGINE_JAR" core.local.LocalMigrationProbe \
            | tee build/local-migration-probe.txt
          grep -q 'observeIncoming' build/local-migration-probe.txt
          grep -q 'observeOutgoing' build/local-migration-probe.txt
          grep -q 'beginLocalLogin' build/local-migration-probe.txt
          grep -q 'endLocalSession' build/local-migration-probe.txt

          javap -classpath "$ENGINE_JAR" core.local.LeagueRuntime \
            | tee build/league-runtime.txt
          grep -q 'completeTask' build/league-runtime.txt
          grep -q 'unlockRelic' build/league-runtime.txt
          grep -q 'setExperienceMultiplier' build/league-runtime.txt

      - name: Architecture checkpoint summary
        run: |
          echo 'One LocalGameRuntime authority: compiled'
          echo 'Client view radius and retained 15-tile entity sync radius are independent: verified'
          echo 'Existing typed 2009Scape commands reachable without TCP: verified'
          echo 'RT4 migration patches compile as independent source files: verified'
          echo 'World, interaction, and minimap walking cut over to direct typed commands: compiled'
          echo 'Socketless local login is runtime-driven rather than plugin-driven: verified'
          echo 'Pinned RT4 SignLink override redirects JS5 to memory: compiled'
          echo 'Persistent league task/relic runtime and RT4 state bridge: verified'
          echo 'Persistent local account metadata provider: verified'
