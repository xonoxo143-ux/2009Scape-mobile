name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - grand-leagues-self-contained

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Build self-contained APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: build.log
          if-no-files-found: warn

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deliverable
          APK="$(find app_pojavlauncher/build/outputs/apk -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          cp "$APK" deliverable/GrandLeagues.apk
          sha256sum deliverable/GrandLeagues.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrandLeagues-APK
          path: deliverable/GrandLeagues.apk
          if-no-files-found: error
