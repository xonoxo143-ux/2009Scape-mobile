name: Vanilla Baseline APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - vanilla-baseline-apk
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout untouched mobile source
        uses: actions/checkout@v4

      - name: Publish run id for inspection
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci
          printf 'run_id=%s\nsha=%s\n' '${{ github.run_id }}' '${{ github.sha }}' > ci/baseline-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/baseline-run-id.txt
          git commit -m 'Record baseline build run id'
          git push origin HEAD:vanilla-baseline-apk

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Recover known-good runtimes from official 2.4 APK
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE_JSON=/tmp/release.json
          curl --fail --location --silent --show-error \
            https://api.github.com/repos/2009scape/2009Scape-mobile/releases/tags/hd-2.4 \
            -o "$RELEASE_JSON"
          jq -r '.assets[] | [.name, .size, .browser_download_url] | @tsv' "$RELEASE_JSON"
          APK_URL="$(jq -r '.assets[] | select(.name | endswith(".apk")) | select((.name | ascii_downcase | contains("noruntime")) | not) | .browser_download_url' "$RELEASE_JSON" | head -1)"
          test -n "$APK_URL"
          test "$APK_URL" != "null"
          curl --fail --location --retry 3 --silent --show-error "$APK_URL" -o /tmp/official-2.4.apk
          unzip -l /tmp/official-2.4.apk | grep -F 'assets/components/jre/' | head
          unzip -l /tmp/official-2.4.apk | grep -F 'assets/components/jre-new/' | head
          rm -rf /tmp/official-runtime
          mkdir -p /tmp/official-runtime
          unzip -q /tmp/official-2.4.apk 'assets/components/jre/*' 'assets/components/jre-new/*' -d /tmp/official-runtime
          rm -rf app_pojavlauncher/src/main/assets/components/jre app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components
          cp -a /tmp/official-runtime/assets/components/jre app_pojavlauncher/src/main/assets/components/jre
          cp -a /tmp/official-runtime/assets/components/jre-new app_pojavlauncher/src/main/assets/components/jre-new

      - name: Verify recovered runtimes
        shell: bash
        run: |
          set -euxo pipefail
          test -d app_pojavlauncher/src/main/assets/components/jre
          test -d app_pojavlauncher/src/main/assets/components/jre-new
          test -n "$(find app_pojavlauncher/src/main/assets/components/jre -type f -print -quit)"
          test -n "$(find app_pojavlauncher/src/main/assets/components/jre-new -type f -print -quit)"
          du -sh app_pojavlauncher/src/main/assets/components/jre app_pojavlauncher/src/main/assets/components/jre-new
          find app_pojavlauncher/src/main/assets/components/jre -type f | sort | head -40
          find app_pojavlauncher/src/main/assets/components/jre-new -type f | sort | head -40

      - name: Set up Gradle 7.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.1'

      - name: Build LWJGL compatibility JAR
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon
          test -f app_pojavlauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-classes.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build full debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009scape-vanilla-baseline.apk

      - name: Audit APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=out/2009scape-vanilla-baseline.apk
          unzip -l "$APK" > out/apk-contents.txt
          grep -F 'assets/rt4.jar' out/apk-contents.txt
          grep -F 'assets/config.json' out/apk-contents.txt
          grep -F 'assets/components/lwjgl3/lwjgl-glfw-classes.jar' out/apk-contents.txt
          grep -F 'assets/components/jre/' out/apk-contents.txt
          grep -F 'assets/components/jre-new/' out/apk-contents.txt
          grep -F 'assets/plugins/MobileClientBindings.zip' out/apk-contents.txt
          grep -F 'lib/arm64-v8a/' out/apk-contents.txt
          sha256sum "$APK" | tee out/SHA256SUMS.txt
          ls -lh "$APK" | tee out/apk-size.txt

      - name: Upload audited baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape-vanilla-baseline
          path: |
            out/2009scape-vanilla-baseline.apk
            out/SHA256SUMS.txt
            out/apk-size.txt
            out/apk-contents.txt
          if-no-files-found: error
          retention-days: 14
