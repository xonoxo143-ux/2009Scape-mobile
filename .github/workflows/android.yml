name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    paths:
      - '.github/ci-trigger'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8 for legacy launcher support build
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.1

      - name: Build launcher support JARs
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17 for combined single-player build
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch pinned 2009Scape world engine
        run: |
          set -euxo pipefail
          UPSTREAM_COMMIT="9f634148bab11fad821943864cb71d7c6af98da4"
          git init upstream-server
          git -C upstream-server remote add origin https://gitlab.com/2009scape/2009scape.git
          git -C upstream-server fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream-server checkout --detach FETCH_HEAD
          git -C upstream-server lfs pull
          test "$(git -C upstream-server rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          printf '%s\n' "$UPSTREAM_COMMIT" | tee upstream-server-commit.txt

          CACHE="upstream-server/Server/data/cache/main_file_cache.dat2"
          test -f "$CACHE"
          test "$(stat -c%s "$CACHE")" -gt 50000000
          ! grep -a -q 'git-lfs.github.com/spec/v1' "$CACHE"

      - name: Prepare embedded single-player world engine
        run: |
          set -euxo pipefail
          python3 singleplayer/native-refactor/prepare_upstream.py \
            upstream-server/Server \
            --repo-root "$GITHUB_WORKSPACE"
          test -f singleplayer-generated.conf
          test -f singleplayer-world-version.txt
          grep -q 'LocalMigrationProbe.observeIncoming' \
            upstream-server/Server/src/main/core/net/packet/PacketProcessor.kt
          grep -q 'LocalMigrationProbe.observeOutgoing' \
            upstream-server/Server/src/main/core/net/packet/PacketRepository.java
          grep -q 'beginLocalLogin' \
            upstream-server/Server/src/main/core/local/LocalMigrationProbe.kt
          grep -q 'opcode != 15' \
            upstream-server/Server/src/main/core/net/event/HSReadEvent.java

      - name: Build world engine on Java 17
        working-directory: upstream-server/Server
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Smoke-test world engine protocol
        run: |
          set -euxo pipefail
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) | head -n 1)
          test -n "$ENGINE_JAR"
          ENGINE_JAR=$(readlink -f "$ENGINE_JAR")
          mkdir -p out
          cp singleplayer-generated.conf upstream-server/Server/worldprops/local.conf

          pushd upstream-server/Server >/dev/null
          java -Xms512m -Xmx3072m -jar "$ENGINE_JAR" worldprops/local.conf > "$GITHUB_WORKSPACE/out/world-engine-smoke.log" 2>&1 &
          ENGINE_PID=$!
          popd >/dev/null

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== world engine smoke log ====="
              tail -n 400 "$GITHUB_WORKSPACE/out/world-engine-smoke.log" || true
              echo "===== end world engine smoke log ====="
            fi
            kill -TERM "$ENGINE_PID" 2>/dev/null || true
            sleep 1
            kill -KILL "$ENGINE_PID" 2>/dev/null || true
            wait "$ENGINE_PID" 2>/dev/null || true
            return "$status"
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import socket, time
          deadline = time.time() + 300
          last = None
          while time.time() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 43595), timeout=1):
                      print('World engine JS5 compatibility socket is ready', flush=True)
                      break
              except Exception as exc:
                  last = exc
                  time.sleep(0.5)
          else:
              raise SystemExit('World engine did not open JS5 compatibility socket: %r' % (last,))
          PY

          ss -ltn | tee out/world-engine-listeners.txt
          python3 - <<'PY'
          import re
          lines = open('out/world-engine-listeners.txt').read().splitlines()
          listeners = [line for line in lines if re.search(r':43595\s', line)]
          print('JS5 compatibility listeners:', listeners)
          allowed = ('127.0.0.1:43595', '[::ffff:127.0.0.1]:43595')
          if not any(any(token in line for token in allowed) for line in listeners):
              raise SystemExit('JS5 compatibility socket is not loopback-only')
          forbidden = ('0.0.0.0:43595', '*:43595', '[::]:43595')
          if any(any(token in line for token in forbidden) for line in listeners):
              raise SystemExit('JS5 compatibility socket is exposed beyond loopback')
          PY

          cleanup
          trap - EXIT

      - name: Verify engine bytecode fits Java 17
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          jars = glob.glob('upstream-server/Server/target/*-jar-with-dependencies.jar')
          if not jars:
              jars = glob.glob('upstream-server/Server/target/*-with-dependencies.jar')
          if len(jars) != 1:
              raise SystemExit(f'Expected one engine fat jar, got: {jars}')
          bad = []
          highest = 0
          with zipfile.ZipFile(jars[0]) as z:
              for name in z.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = z.read(name)
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  major = struct.unpack('>H', data[6:8])[0]
                  highest = max(highest, major)
                  if major > 61:
                      bad.append((name, major))
          print('Highest classfile version:', highest)
          if bad:
              for name, major in bad[:50]:
                  print(major, name)
              raise SystemExit('Engine contains classes newer than Java 17')
          PY

      - name: Package embedded world assets
        run: |
          set -euxo pipefail
          ASSET_DIR="app_pojavlauncher/src/main/assets/singleplayer"
          mkdir -p "$ASSET_DIR"
          ENGINE_JAR=$(find upstream-server/Server/target -maxdepth 1 -type f \( -name '*-jar-with-dependencies.jar' -o -name '*-with-dependencies.jar' \) | head -n 1)
          test -n "$ENGINE_JAR"
          cp "$ENGINE_JAR" "$ASSET_DIR/engine.jar"
          cp singleplayer-generated.conf "$ASSET_DIR/world-default.conf"
          cp singleplayer-world-version.txt "$ASSET_DIR/world-version.txt"
          rm -f "$ASSET_DIR/world-data.zip"
          (cd upstream-server/Server && zip -qr "$GITHUB_WORKSPACE/$ASSET_DIR/world-data.zip" data)
          ls -lh "$ASSET_DIR"

      - name: Build combined JVM bootstrap
        run: |
          set -euxo pipefail
          rm -rf build/singleplayer-bootstrap
          mkdir -p build/singleplayer-bootstrap
          mapfile -t RT4_PATCHES < <(find singleplayer/client-patches/rt4 -maxdepth 1 -type f -name '*.java' | sort)
          test "${#RT4_PATCHES[@]}" -ge 7
          printf 'RT4 patch source: %s\n' "${RT4_PATCHES[@]}"
          javac --release 17 \
            -cp app_pojavlauncher/src/main/assets/rt4.jar \
            -d build/singleplayer-bootstrap \
            singleplayer/inprocess/InProcessBootstrap.java \
            singleplayer/inprocess/MobileGestureBridge.java \
            singleplayer/inprocess/MobileLifecycleBridge.java \
            "${RT4_PATCHES[@]}"
          rm -f app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar
          jar --create \
            --file app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar \
            -C build/singleplayer-bootstrap singleplayer \
            -C build/singleplayer-bootstrap rt4
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'singleplayer/InProcessBootstrap.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'singleplayer/MobileGestureBridge.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'singleplayer/MobileLifecycleBridge.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/AudioThread.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/NanoTimer.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/OpenALAudioChannel.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/ClientProt.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/FriendsList.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/IgnoreList.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/ClanChat.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/LocalLoginBridge.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/LocalPresentationBridge.class'
          jar -tf app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar | grep -q 'rt4/BufferedSocket.class'

      - name: Package production ARM64 Java 17 runtime
        run: |
          set -euxo pipefail
          ASSET_DIR="app_pojavlauncher/src/main/assets/singleplayer"
          JRE_TAG="jre17-ec28559"
          JRE_FILE="jre17-arm64-20210825-release.tar.xz"
          JRE_SHA256="c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d"
          JRE_URL="https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/${JRE_TAG}/${JRE_FILE}"

          curl --fail --location --retry 5 --retry-delay 2 \
            "$JRE_URL" -o "$ASSET_DIR/runtime-jre17.tar.xz"
          echo "$JRE_SHA256  $ASSET_DIR/runtime-jre17.tar.xz" | sha256sum -c -
          printf '%s/%s\n' "$JRE_TAG" "$JRE_FILE" > "$ASSET_DIR/runtime-jre17-version.txt"

          rm -rf build/runtime-check
          mkdir -p build/runtime-check
          tar -xJf "$ASSET_DIR/runtime-jre17.tar.xz" -C build/runtime-check
          test -f build/runtime-check/release
          grep -E '^JAVA_VERSION="17([.]|"|$)' build/runtime-check/release
          grep -E '^OS_ARCH="(aarch64|arm64)"' build/runtime-check/release
          test -f build/runtime-check/lib/server/libjvm.so
          readelf -h build/runtime-check/lib/server/libjvm.so | grep -E 'Machine:.*AArch64'

      - name: Package Android SQLite JNI
        run: |
          set -euxo pipefail
          SQLITE_VERSION="3.53.4.0"
          SQLITE_ANDROID_SHA256="4125c0c02ef226896dae098f7b38ee66b7b376df243dd340ff09e2d5a3e3ee1b"
          SQLITE_ANDROID_JAR="sqlite-jdbc-${SQLITE_VERSION}-natives-android.jar"
          SQLITE_ANDROID_URL="https://github.com/xerial/sqlite-jdbc/releases/download/${SQLITE_VERSION}/${SQLITE_ANDROID_JAR}"

          curl --fail --location --retry 5 --retry-delay 2 \
            "$SQLITE_ANDROID_URL" -o "build/$SQLITE_ANDROID_JAR"
          echo "$SQLITE_ANDROID_SHA256  build/$SQLITE_ANDROID_JAR" | sha256sum -c -

          mkdir -p \
            app_pojavlauncher/src/main/jniLibs/arm64-v8a \
            app_pojavlauncher/src/main/jniLibs/x86_64
          rm -f \
            app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so \
            app_pojavlauncher/src/main/jniLibs/x86_64/libsqlitejdbc.so

          unzip -p "$SQLITE_ANDROID_JAR" \
            org/sqlite/native/Linux-Android/aarch64/libsqlitejdbc.so \
            > app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so
          unzip -p "$SQLITE_ANDROID_JAR" \
            org/sqlite/native/Linux-Android/x86_64/libsqlitejdbc.so \
            > app_pojavlauncher/src/main/jniLibs/x86_64/libsqlitejdbc.so

          test -s app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so
          test -s app_pojavlauncher/src/main/jniLibs/x86_64/libsqlitejdbc.so

          readelf -h app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so | grep -E 'Machine:.*AArch64'
          readelf -h app_pojavlauncher/src/main/jniLibs/x86_64/libsqlitejdbc.so | grep -E 'Machine:.*X86-64'

          readelf -d app_pojavlauncher/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so | tee out/sqlite-arm64-needed.txt
          readelf -d app_pojavlauncher/src/main/jniLibs/x86_64/libsqlitejdbc.so | tee out/sqlite-x86_64-needed.txt
          ! grep -q 'libc.so.6' out/sqlite-arm64-needed.txt
          ! grep -q 'libc.so.6' out/sqlite-x86_64-needed.txt

      - name: Build single-player client plugins
        run: |
          set -euxo pipefail
          rm -rf build/singleplayer-plugin
          mkdir -p build/singleplayer-plugin/login build/singleplayer-plugin/touch

          cp singleplayer/client-plugin/LocalSinglePlayerLogin.java \
            build/singleplayer-plugin/login/plugin.java
          javac --release 8 \
            -cp app_pojavlauncher/src/main/assets/rt4.jar \
            -d build/singleplayer-plugin/login \
            build/singleplayer-plugin/login/plugin.java
          rm -f build/singleplayer-plugin/login/plugin.java

          cp singleplayer/client-plugin/MobileTouchControls.java \
            build/singleplayer-plugin/touch/plugin.java
          javac --release 8 \
            -cp "app_pojavlauncher/src/main/assets/rt4.jar:app_pojavlauncher/src/main/assets/singleplayer-bootstrap.jar" \
            -d build/singleplayer-plugin/touch \
            build/singleplayer-plugin/touch/plugin.java
          rm -f build/singleplayer-plugin/touch/plugin.java

          rm -f \
            app_pojavlauncher/src/main/assets/plugins/LocalSinglePlayerLogin.zip \
            app_pojavlauncher/src/main/assets/plugins/MobileTouchControls.zip

          (cd build/singleplayer-plugin/login && zip -qr \
            "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/plugins/LocalSinglePlayerLogin.zip" \
            LocalSinglePlayerLogin)
          (cd build/singleplayer-plugin/touch && zip -qr \
            "$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/plugins/MobileTouchControls.zip" \
            MobileTouchControls)

          unzip -l app_pojavlauncher/src/main/assets/plugins/LocalSinglePlayerLogin.zip
          unzip -l app_pojavlauncher/src/main/assets/plugins/MobileTouchControls.zip

      - name: Verify single-process architecture in source
        run: |
          set -euxo pipefail
          ! grep -q 'LocalServerService' app_pojavlauncher/src/main/AndroidManifest.xml
          grep -q 'SinglePlayerManager.getRuntime()' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'singleplayer.InProcessBootstrap' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'org.sqlite.lib.path' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'org.sqlite.lib.name=libsqlitejdbc.so' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'new TouchInputController' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'setMobileAppPaused(true)' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          grep -q 'setMobileAppPaused(false)' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          ! grep -q 'R.id.mouseMode' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          ! grep -q 'R.id.camera' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          ! grep -q 'R.id.mb2' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          ! grep -q 'R.id.keyboard' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/JavaGUILauncherActivity.java
          ! grep -q 'AsyncAssetManager.unpackRuntime' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/PojavApplication.java

      - name: Remove unused legacy Java 8 runtime assets
        run: |
          set -euxo pipefail
          rm -rf app_pojavlauncher/src/main/assets/components/jre

      - name: Build production self-contained APK
        run: |
          set -euxo pipefail
          gradle :app_pojavlauncher:assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009scape-mobile.apk
          sha256sum out/2009scape-mobile.apk > out/2009scape-mobile.apk.sha256

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape-mobile
          path: |
            out/2009scape-mobile.apk
            out/2009scape-mobile.apk.sha256
          if-no-files-found: error

      - name: Verify combined production APK
        run: |
          set -euxo pipefail
          unzip -l out/2009scape-mobile.apk | tee out/apk-contents.txt
          grep -q 'assets/singleplayer/engine.jar' out/apk-contents.txt
          grep -q 'assets/singleplayer/world-data.zip' out/apk-contents.txt
          grep -q 'assets/singleplayer/world-default.conf' out/apk-contents.txt
          grep -q 'assets/singleplayer/world-version.txt' out/apk-contents.txt
          grep -q 'assets/singleplayer/runtime-jre17.tar.xz' out/apk-contents.txt
          grep -q 'assets/singleplayer/runtime-jre17-version.txt' out/apk-contents.txt
          grep -q 'assets/singleplayer-bootstrap.jar' out/apk-contents.txt
          grep -q 'assets/plugins/LocalSinglePlayerLogin.zip' out/apk-contents.txt
          grep -q 'assets/plugins/MobileTouchControls.zip' out/apk-contents.txt
          grep -q 'lib/arm64-v8a/libsqlitejdbc.so' out/apk-contents.txt
          grep -q 'lib/x86_64/libsqlitejdbc.so' out/apk-contents.txt
          ! grep -q 'assets/components/jre/' out/apk-contents.txt

          unzip -p out/2009scape-mobile.apk assets/singleplayer-bootstrap.jar > out/singleplayer-bootstrap.jar
          unzip -t out/singleplayer-bootstrap.jar
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'singleplayer/InProcessBootstrap.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'singleplayer/MobileGestureBridge.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'singleplayer/MobileLifecycleBridge.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/AudioThread.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/NanoTimer.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/OpenALAudioChannel.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/ClientProt.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/FriendsList.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/IgnoreList.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/ClanChat.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/LocalLoginBridge.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/LocalPresentationBridge.class'
          unzip -l out/singleplayer-bootstrap.jar | grep -q 'rt4/BufferedSocket.class'

          unzip -p out/2009scape-mobile.apk assets/plugins/LocalSinglePlayerLogin.zip > out/LocalSinglePlayerLogin.zip
          unzip -t out/LocalSinglePlayerLogin.zip
          unzip -l out/LocalSinglePlayerLogin.zip | grep -q 'LocalSinglePlayerLogin/plugin.class'

          unzip -p out/2009scape-mobile.apk assets/plugins/MobileTouchControls.zip > out/MobileTouchControls.zip
          unzip -t out/MobileTouchControls.zip
          unzip -l out/MobileTouchControls.zip | grep -q 'MobileTouchControls/plugin.class'

          unzip -p out/2009scape-mobile.apk assets/singleplayer/world-data.zip > out/world-data.zip
          unzip -t out/world-data.zip
          unzip -l out/world-data.zip | grep -q 'data/cache/main_file_cache.dat2'
          unzip -l out/world-data.zip | grep -q 'data/configs/npc_spawns.json'

          unzip -p out/2009scape-mobile.apk assets/singleplayer/runtime-jre17.tar.xz > out/runtime-jre17-arm64.tar.xz
          echo "c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d  out/runtime-jre17-arm64.tar.xz" | sha256sum -c -

      - name: Verify production APK signing identity
        run: |
          set -euxo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs out/2009scape-mobile.apk | tee out/apk-signing.txt
          grep -qi 'd0d0886a0d7e3486e6627f9b8011027fe3c6b0fb09424530b6d7be14f8c2cc33' out/apk-signing.txt

      - name: Build x86_64 emulator test APK
        run: |
          set -euxo pipefail
          ASSET_DIR="app_pojavlauncher/src/main/assets/singleplayer"
          JRE_TAG="jre17-ec28559"
          JRE_FILE="jre17-x86_64-20210825-release.tar.xz"
          JRE_URL="https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/${JRE_TAG}/${JRE_FILE}"

          curl --fail --location --retry 5 --retry-delay 2 \
            "$JRE_URL" -o "$ASSET_DIR/runtime-jre17.tar.xz"
          printf '%s/%s\n' "$JRE_TAG" "$JRE_FILE" > "$ASSET_DIR/runtime-jre17-version.txt"

          rm -rf build/runtime-check-x86
          mkdir -p build/runtime-check-x86
          tar -xJf "$ASSET_DIR/runtime-jre17.tar.xz" -C build/runtime-check-x86
          test -f build/runtime-check-x86/release
          grep -E '^JAVA_VERSION="17([.]|"|$)' build/runtime-check-x86/release
          grep -E '^OS_ARCH="(x86_64|amd64)"' build/runtime-check-x86/release
          test -f build/runtime-check-x86/lib/server/libjvm.so
          readelf -h build/runtime-check-x86/lib/server/libjvm.so | grep -E 'Machine:.*X86-64'

          gradle :app_pojavlauncher:assembleDebug --no-daemon --rerun-tasks \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009scape-mobile-x86-e2e.apk

      - name: Upload x86_64 emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape-mobile-x86-e2e
          path: out/2009scape-mobile-x86-e2e.apk
          if-no-files-found: error

  emulator-e2e:
    name: Combined single-player Android E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download x86_64 emulator APK
        uses: actions/download-artifact@v5
        with:
          name: 2009scape-mobile-x86-e2e
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK and reach local game
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: out/2009scape-mobile-x86-e2e.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 6144M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 900
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window
            -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash .github/scripts/android-singleplayer-e2e.sh full

      - name: Upload Android E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-combined-e2e-diagnostics
          path: out/android-e2e-full
          if-no-files-found: ignore
