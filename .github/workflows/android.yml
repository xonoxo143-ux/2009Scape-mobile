name: Build Grand Leagues APK

on:
  workflow_dispatch:
  push:
    branches:
      - grand-leagues-clean

permissions:
  contents: write

concurrency:
  group: grand-leagues-clean-apk
  cancel-in-progress: false

env:
  SERVER_DIR: vendor/2009scape/Server
  APK_NAME: 2009Scape-Grand-Leagues-arm64-debug.apk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # One-time migration only. Once these paths have been committed, this step
      # is a no-op and the build is completely sourced from this repository.
      - name: Bootstrap missing in-repo payloads
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          if [[ ! -s "$SERVER_DIR/pom.xml" ]]; then
            echo "Vendoring the pinned Grand Leagues server into this repository..."
            TMP_SERVER="$RUNNER_TEMP/2009scape-bootstrap"
            UPSTREAM="$(tr -d '\r\n' < build/grandleague/server-overlay/upstream.sha)"

            git init -q "$TMP_SERVER"
            git -C "$TMP_SERVER" remote add origin https://gitlab.com/2009scape/2009scape.git
            if ! git -C "$TMP_SERVER" fetch --depth 1 origin "$UPSTREAM"; then
              git -C "$TMP_SERVER" fetch --depth 250 origin master
            fi
            git -C "$TMP_SERVER" checkout -q --detach "$UPSTREAM"

            cat build/grandleague/server-overlay/parts/part-* > "$RUNNER_TEMP/grand-leagues-overlay.b64"
            base64 -d "$RUNNER_TEMP/grand-leagues-overlay.b64" > "$RUNNER_TEMP/grand-leagues-overlay.tar.gz"
            EXPECTED="$(awk '{print $1}' build/grandleague/server-overlay/sha256.txt)"
            printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/grand-leagues-overlay.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/grand-leagues-overlay.tar.gz" -C "$TMP_SERVER"

            if [[ -s build/grandleague/server-overlay/deletes.txt ]]; then
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                rm -rf -- "$TMP_SERVER/$path"
              done < build/grandleague/server-overlay/deletes.txt
            fi

            test -s "$TMP_SERVER/Server/src/main/content/global/leagues/GrandLeagueManager.kt"
            grep -q 'Boolean.getBoolean("grandleague.mobile")' "$TMP_SERVER/Server/src/main/content/global/leagues/GrandLeagueManager.kt"

            rm -rf vendor/2009scape
            mkdir -p vendor/2009scape
            rsync -a --delete --exclude='.git' "$TMP_SERVER/Server/" "$SERVER_DIR/"
            printf '%s\n' "$UPSTREAM" > vendor/2009scape/UPSTREAM_COMMIT
            changed=1
          fi

          JRE8=app_pojavlauncher/src/main/assets/components/jre
          if [[ ! -s "$JRE8/version" || ! -s "$JRE8/universal.tar.xz" || ! -s "$JRE8/bin-arm64.tar.xz" ]]; then
            echo "Vendoring the Android Java 8 runtime into this repository..."
            TMP_JRE8="$RUNNER_TEMP/jre8-bootstrap"
            mkdir -p "$TMP_JRE8"
            curl --fail --location --retry 3 \
              https://github.com/TeamPojavLauncher/PojavLauncher/releases/download/v0.1.1/PojavLauncher-debug-full.apk \
              -o "$TMP_JRE8/pojav-full.apk"
            unzip -q "$TMP_JRE8/pojav-full.apk" 'assets/components/jre/*' -d "$TMP_JRE8/unpack"
            rm -rf "$JRE8"
            mkdir -p "$(dirname "$JRE8")"
            cp -a "$TMP_JRE8/unpack/assets/components/jre" "$JRE8"
            changed=1
          fi

          JRE17=app_pojavlauncher/src/main/assets/components/grandleague-jre17
          if [[ ! -s "$JRE17/jre17-arm64.tar.xz" ]]; then
            echo "Vendoring the Android Java 17 runtime into this repository..."
            TMP_JRE17="$RUNNER_TEMP/jre17-bootstrap"
            mkdir -p "$TMP_JRE17/extract"
            curl --fail --location --retry 3 \
              https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-ec28559/jre17-arm64-20210825-release.tar.xz \
              -o "$TMP_JRE17/source.tar.xz"
            tar -xJf "$TMP_JRE17/source.tar.xz" -C "$TMP_JRE17/extract"
            RELEASE_FILE="$(find "$TMP_JRE17/extract" -type f -name release -print -quit)"
            test -n "$RELEASE_FILE"
            RUNTIME_ROOT="$(dirname "$RELEASE_FILE")"
            test -s "$RUNTIME_ROOT/bin/java"
            test -n "$(find "$RUNTIME_ROOT" -type f -name libjvm.so -print -quit)"
            rm -rf "$JRE17"
            mkdir -p "$JRE17"
            tar -chJf "$JRE17/jre17-arm64.tar.xz" -C "$RUNTIME_ROOT" .
            changed=1
          fi

          if [[ "$changed" == 1 ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f vendor/2009scape \
              app_pojavlauncher/src/main/assets/components/jre \
              app_pojavlauncher/src/main/assets/components/grandleague-jre17
            git commit -m 'Vendor Grand Leagues server and Android runtimes [monorepo]'
            git push origin HEAD:grand-leagues-clean
          fi

      - name: Verify monorepo inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SERVER_DIR/pom.xml"
          test -s "$SERVER_DIR/src/main/content/global/leagues/GrandLeagueManager.kt"
          test -s app_pojavlauncher/src/main/assets/components/jre/version
          test -s app_pojavlauncher/src/main/assets/components/jre/universal.tar.xz
          test -s app_pojavlauncher/src/main/assets/components/jre/bin-arm64.tar.xz
          test -s app_pojavlauncher/src/main/assets/components/grandleague-jre17/jre17-arm64.tar.xz

      - name: Set up JDK 11 for server
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: vendor/2009scape/Server/pom.xml

      - name: Test and build Grand Leagues server
        shell: bash
        run: |
          set -euo pipefail
          cd "$SERVER_DIR"
          mvn -B -ntp test package

          SERVER_JAR="$(find target -maxdepth 1 -type f -name '*jar-with-dependencies*.jar' -print -quit)"
          test -s "$SERVER_JAR"

          PAYLOAD="$RUNNER_TEMP/grandleague-payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD/worldprops"
          cp "$SERVER_JAR" "$PAYLOAD/server.jar"
          cp -a data "$PAYLOAD/data"
          cp worldprops/default.conf "$PAYLOAD/worldprops/mobile.conf"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'grandleague-payload/worldprops/mobile.conf'
          s = p.read_text()
          replacements = {
              'write_logs = true': 'write_logs = false',
              'noauth_default_admin = true': 'noauth_default_admin = false',
              'watchdog_enabled = true': 'watchdog_enabled = false',
              'name = "2009Scape"': 'name = "Grand Leagues"',
              'name_ge = "2009Scape"': 'name_ge = "Grand Leagues"',
              'debug = true': 'debug = false',
              'dev = true': 'dev = false',
              'activity = "2009Scape Classic."': 'activity = "Grand Leagues"',
              'enable_default_clan = true': 'enable_default_clan = false',
              'enable_bots = true': 'enable_bots = false',
              'max_adv_bots = 100': 'max_adv_bots = 0',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected server config line: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          DEST="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/grandleague"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          (cd "$PAYLOAD" && zip -q -r "$DEST/server.zip" .)
          unzip -t "$DEST/server.zip" >/dev/null
          printf '%s\n' "$GITHUB_SHA" > "$DEST/version.txt"

      - name: Set up JDK 8 for launcher support
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build launcher support
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          ./gradlew :jre_lwjgl3glfw:build --no-daemon --stacktrace

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and validate APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

          mkdir -p out
          APK="out/$APK_NAME"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/grandleague/server.zip' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/grandleague/version.txt' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/components/jre/version' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/components/grandleague-jre17/jre17-arm64.tar.xz' "$RUNNER_TEMP/apk-files.txt"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Leagues-APK
          path: |
            out/${{ env.APK_NAME }}
            out/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish latest APK in this repository
        if: github.ref == 'refs/heads/grand-leagues-clean'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=grand-leagues-clean-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" --clobber
          else
            gh release create "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" \
              --title '2009Scape Grand Leagues Android' \
              --notes 'Built from the self-contained grand-leagues-clean branch.' \
              --prerelease
          fi
