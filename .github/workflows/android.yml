name: Build Grand Leagues APK

on:
  workflow_dispatch:
  push:
    branches:
      - grand-leagues-self-contained
    paths:
      - .github/workflows/android.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: grand-leagues-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify this build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=grand-leagues-apk \
            -f description='Grand Leagues APK build running' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Set up JDK 11 for server
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build bundled Grand League server
        shell: bash
        run: |
          set -euo pipefail

          SERVER="$RUNNER_TEMP/2009scape"
          UPSTREAM="$(tr -d '\r\n' < build/grandleague/server-overlay/upstream.sha)"

          git init -q "$SERVER"
          git -C "$SERVER" remote add origin https://gitlab.com/2009scape/2009scape.git
          if ! git -C "$SERVER" fetch --depth 1 origin "$UPSTREAM"; then
            git -C "$SERVER" fetch --depth 250 origin master
          fi
          git -C "$SERVER" checkout -q --detach "$UPSTREAM"

          cat build/grandleague/server-overlay/parts/part-* > "$RUNNER_TEMP/grand-leagues-overlay.b64"
          base64 -d "$RUNNER_TEMP/grand-leagues-overlay.b64" > "$RUNNER_TEMP/grand-leagues-overlay.tar.gz"
          EXPECTED="$(awk '{print $1}' build/grandleague/server-overlay/sha256.txt)"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/grand-leagues-overlay.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grand-leagues-overlay.tar.gz" -C "$SERVER"

          if [[ -s build/grandleague/server-overlay/deletes.txt ]]; then
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              rm -rf -- "$SERVER/$path"
            done < build/grandleague/server-overlay/deletes.txt
          fi

          test -s "$SERVER/Server/src/main/content/global/leagues/GrandLeagueManager.kt"
          grep -q 'Boolean.getBoolean("grandleague.mobile")' "$SERVER/Server/src/main/content/global/leagues/GrandLeagueManager.kt"

          cd "$SERVER/Server"
          mvn -B -ntp test package

          SERVER_JAR="$(find target -maxdepth 1 -type f -name '*jar-with-dependencies*.jar' -print -quit)"
          test -s "$SERVER_JAR"

          PAYLOAD="$RUNNER_TEMP/grandleague-payload"
          mkdir -p "$PAYLOAD/worldprops"
          cp "$SERVER_JAR" "$PAYLOAD/server.jar"
          cp -a data "$PAYLOAD/data"
          cp worldprops/default.conf "$PAYLOAD/worldprops/mobile.conf"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'grandleague-payload/worldprops/mobile.conf'
          s = p.read_text()
          replacements = {
              'write_logs = true': 'write_logs = false',
              'noauth_default_admin = true': 'noauth_default_admin = false',
              'watchdog_enabled = true': 'watchdog_enabled = false',
              'name = "2009Scape"': 'name = "Grand Leagues"',
              'name_ge = "2009Scape"': 'name_ge = "Grand Leagues"',
              'debug = true': 'debug = false',
              'dev = true': 'dev = false',
              'activity = "2009Scape Classic."': 'activity = "Grand Leagues"',
              'enable_default_clan = true': 'enable_default_clan = false',
              'enable_bots = true': 'enable_bots = false',
              'max_adv_bots = 100': 'max_adv_bots = 0',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected server config line: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          DEST="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/grandleague"
          mkdir -p "$DEST"
          (cd "$PAYLOAD" && zip -q -r "$DEST/server.zip" .)
          unzip -t "$DEST/server.zip" >/dev/null
          printf '%s\n' "$GITHUB_SHA" > "$DEST/version.txt"

      - name: Add client JRE 8
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/jre8"
          mkdir -p "$TMP"
          curl --fail --location --retry 3 \
            https://github.com/TeamPojavLauncher/PojavLauncher/releases/download/v0.1.1/PojavLauncher-debug-full.apk \
            -o "$TMP/pojav-full.apk"
          unzip -q "$TMP/pojav-full.apk" 'assets/components/jre/*' -d "$TMP/unpack"
          SRC="$TMP/unpack/assets/components/jre"
          test -s "$SRC/version"
          test -s "$SRC/universal.tar.xz"
          test -s "$SRC/bin-arm64.tar.xz"
          DEST="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/components/jre"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a "$SRC" "$DEST"

      - name: Add server JRE 17
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/jre17"
          mkdir -p "$TMP/extract"
          curl --fail --location --retry 3 \
            https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-ec28559/jre17-arm64-20210825-release.tar.xz \
            -o "$TMP/source.tar.xz"
          tar -xJf "$TMP/source.tar.xz" -C "$TMP/extract"

          RELEASE_FILE="$(find "$TMP/extract" -type f -name release -print -quit)"
          test -n "$RELEASE_FILE"
          RUNTIME_ROOT="$(dirname "$RELEASE_FILE")"
          test -s "$RUNTIME_ROOT/bin/java"
          test -n "$(find "$RUNTIME_ROOT" -type f -name libjvm.so -print -quit)"

          DEST="$GITHUB_WORKSPACE/app_pojavlauncher/src/main/assets/components/grandleague-jre17"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          tar -chJf "$DEST/jre17-arm64.tar.xz" -C "$RUNTIME_ROOT" .

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build launcher support
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          ./gradlew :jre_lwjgl3glfw:build --no-daemon --stacktrace

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

          mkdir -p out
          APK="out/2009Scape-Grand-Leagues-arm64-debug.apk"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/grandleague/server.zip' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/grandleague/version.txt' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/components/jre/version' "$RUNNER_TEMP/apk-files.txt"
          grep -q 'assets/components/grandleague-jre17/jre17-arm64.tar.xz' "$RUNNER_TEMP/apk-files.txt"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grand-leagues-latest
          name: 2009Scape Grand Leagues Android
          prerelease: true
          make_latest: true
          overwrite_files: true
          files: |
            out/2009Scape-Grand-Leagues-arm64-debug.apk
            out/2009Scape-Grand-Leagues-arm64-debug.apk.sha256

      - name: Publish final build status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            STATE=success
            DESC='Grand Leagues APK ready'
          else
            STATE=failure
            DESC='Grand Leagues APK build failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context=grand-leagues-apk \
            -f description="$DESC" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
