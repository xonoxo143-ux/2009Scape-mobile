name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.1

      - name: Build JRE support JARs
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build self-contained debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/2009scape-mobile.apk
          sha256sum out/2009scape-mobile.apk > out/2009scape-mobile.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2009scape-mobile
          path: |
            out/2009scape-mobile.apk
            out/2009scape-mobile.apk.sha256
          if-no-files-found: error
