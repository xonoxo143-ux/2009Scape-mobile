name: Single-player Server Java 8 Compatibility

on:
  push:
    branches:
      - singleplayer-foundation
    paths:
      - '.github/workflows/server-java8.yml'
      - 'singleplayer/**'
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mobile foundation
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Fetch current 2009Scape server
        run: |
          git clone --depth 1 https://gitlab.com/2009scape/2009scape.git upstream-server
          git -C upstream-server rev-parse HEAD | tee upstream-server-commit.txt

      - name: Retarget server to Java 8
        shell: python
        run: |
          from pathlib import Path

          root = Path('upstream-server/Server')
          pom = root / 'pom.xml'
          text = pom.read_text()
          text = text.replace('<kotlin.compiler.jvmTarget>11</kotlin.compiler.jvmTarget>', '<kotlin.compiler.jvmTarget>1.8</kotlin.compiler.jvmTarget>')
          text = text.replace('<maven.compiler.source>11</maven.compiler.source>', '<maven.compiler.source>8</maven.compiler.source>')
          text = text.replace('<maven.compiler.target>11</maven.compiler.target>', '<maven.compiler.target>8</maven.compiler.target>')
          pom.write_text(text)

          replacements = {
              'src/main/content/region/asgarnia/taverley/quest/witchshouse/WitchsHouse.java': [('var line = 12;', 'int line = 12;')],
              'src/main/content/region/asgarnia/taverley/quest/WolfWhistle.java': [('var line = 12;', 'int line = 12;')],
              'src/main/content/region/misthalin/varrock/quest/whatliesbelow/WhatLiesBelow.java': [('var line = 12;', 'int line = 12;')],
              'src/main/core/game/node/entity/player/link/quest/QuestRepository.java': [('var theQuest = QUESTS.get(quest);', 'Quest theQuest = QUESTS.get(quest);')],
          }
          for rel, pairs in replacements.items():
              path = root / rel
              source = path.read_text()
              for old, new in pairs:
                  if old not in source:
                      raise SystemExit(f'Expected Java 10 syntax not found in {rel}: {old}')
                  source = source.replace(old, new)
              path.write_text(source)

      - name: Build current server for Java 8
        working-directory: upstream-server/Server
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -Dmaven.compiler.release=8

      - name: Verify server bytecode is Java 8
        run: |
          mkdir -p verify
          cp upstream-server/Server/target/*-with-dependencies.jar verify/server.jar
          python3 - <<'PY'
          import struct, zipfile
          from pathlib import Path

          jar = Path('verify/server.jar')
          bad = []
          highest = 0
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = z.read(name)
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  major = struct.unpack('>H', data[6:8])[0]
                  highest = max(highest, major)
                  if major > 52:
                      bad.append((name, major))
          print('Highest classfile version:', highest)
          if bad:
              print('Classes newer than Java 8:')
              for name, major in bad[:50]:
                  print(major, name)
              raise SystemExit(1)
          PY

      - name: Upload Java 8 server candidate
        uses: actions/upload-artifact@v4
        with:
          name: singleplayer-server-java8
          path: |
            verify/server.jar
            upstream-server-commit.txt
          if-no-files-found: error
