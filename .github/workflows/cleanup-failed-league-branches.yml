name: One-shot failed League branch cleanup

on:
  push:
    branches:
      - singleplayer-github-updater

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete and verify failed League branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            grand-leagues-apk-build \
            grand-leagues-canonical \
            grand-leagues-clean \
            grand-leagues-self-contained
          do
            ref="heads/${branch}"
            encoded_ref="heads%2F${branch}"
            echo "Deleting $branch"
            code=$(curl --silent --show-error --output /tmp/delete-response \
              --write-out "%{http_code}" \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/${encoded_ref}")
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              cat /tmp/delete-response
              echo "Unexpected HTTP $code deleting $branch" >&2
              exit 1
            fi

            verify=$(curl --silent --show-error --output /dev/null \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/${encoded_ref}")
            if [ "$verify" != "404" ]; then
              echo "Branch still exists after deletion: $branch (HTTP $verify)" >&2
              exit 1
            fi
          done
