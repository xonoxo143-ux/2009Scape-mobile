name: One-shot failed League branch cleanup

on:
  push:
    branches:
      - singleplayer-github-updater

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed League branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            grand-leagues-apk-build \
            grand-leagues-canonical \
            grand-leagues-clean \
            grand-leagues-self-contained
          do
            echo "Deleting $branch"
            git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
              push "https://github.com/${GITHUB_REPOSITORY}.git" --delete "$branch" || true
          done
