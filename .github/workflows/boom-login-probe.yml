name: Capture BoomPS local login handshake

on:
  push:
    branches: [boom-local-singleplayer]
    paths:
      - 'boom-local/login_probe_proxy.py'
      - 'boom-local/rev239_initial_world.py'
      - '.github/workflows/boom-login-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime and UI automation helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xdotool imagemagick openbox openjdk-17-jdk-headless

      - name: Download and patch Boom client
        run: |
          set -euxo pipefail
          mkdir -p boom-local/work boom-local/login-report /tmp/boom-http /tmp/boom-home
          curl -fL --retry 3 https://boom-ps.com/download/files/client-boomps.jar -o boom-local/work/client-boomps.jar
          chmod +x boom-local/patch-client-local.sh
          boom-local/patch-client-local.sh boom-local/work/client-boomps.jar

      - name: Disassemble world-crash client code
        run: |
          set +e
          jar tf boom-local/work/client-boomps-local.jar | grep -E '^osrs/(Client|iy|cB|cH|it|cx|hX|bV|M)\.class$' > boom-local/login-report/relevant-classes.txt
          for cls in Client iy cB cH it cx hX bV M; do
            javap -classpath boom-local/work/client-boomps-local.jar -c -p -l "osrs.$cls" > "boom-local/login-report/${cls}-javap.txt" 2>&1
          done
          set -e

      - name: Serve local jav_config
        run: |
          curl -fL --retry 3 https://boom-ps.com/integrations/jav_config.ws -o /tmp/boom-http/jav_config.ws
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/boom-http/jav_config.ws')
          text=p.read_text(errors='replace').replace('world1.boom-ps.com','127.0.0.1')
          lines=[]
          for line in text.splitlines():
              if line.startswith('codebase='):
                  line='codebase=http://127.0.0.1:8080/'
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n')
          PY
          (cd /tmp/boom-http && python3 -m http.server 8080 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/boom-local/login-report/http.log" 2>&1 &)

      - name: Start JS5 proxy plus local-only login capture
        run: |
          python3 boom-local/login_probe_proxy.py --out boom-local/login-report > boom-local/login-report/proxy.stdout 2>&1 &
          echo $! > boom-local/login-report/proxy.pid
          sleep 2

      - name: Launch client under Xvfb and drive login UI
        continue-on-error: true
        run: |
          set +e
          Xvfb :99 -screen 0 1280x900x24 > boom-local/login-report/xvfb.log 2>&1 &
          echo $! > boom-local/login-report/xvfb.pid
          export DISPLAY=:99
          sleep 1
          openbox > boom-local/login-report/openbox.log 2>&1 &
          echo $! > boom-local/login-report/openbox.pid

          HOME=/tmp/boom-home java -Xmx768m -Xss2m -XX:CompileThreshold=1500 \
            -Xlog:exceptions=trace:file=boom-local/login-report/jvm-exceptions.log:time,level,tags \
            -cp boom-local/work/client-boomps-local.jar net.runelite.client.RuneLite --debug \
            > boom-local/login-report/client.log 2>&1 &
          echo $! > boom-local/login-report/client.pid

          for i in $(seq 1 45); do
            if grep -q 'Cache is ready' boom-local/login-report/client.log 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 4

          import -window root boom-local/login-report/terms-screen.png 2>/dev/null || true
          WIN=$(xdotool search --name 'BoomPS' 2>/dev/null | head -1)
          echo "window=$WIN" | tee boom-local/login-report/window.txt
          if [ -n "$WIN" ]; then
            xdotool windowactivate --sync "$WIN" || true
            xdotool mousemove 544 511 click 1
            sleep 3
            import -window root boom-local/login-report/after-accept.png 2>/dev/null || true

            xdotool key Return
            sleep 1
            import -window root boom-local/login-report/after-enter.png 2>/dev/null || true
            xdotool type --delay 25 'localprobe@example.invalid'
            xdotool key Tab
            xdotool type --delay 25 'localprobe'
            xdotool key Return

            for i in $(seq 1 20); do
              if grep -q 'Game state changed: LOGGED_IN' boom-local/login-report/client.log 2>/dev/null; then break; fi
              sleep 0.25
            done
            import -window root boom-local/login-report/in-world-early.png 2>/dev/null || true
            sleep 10
          fi

          import -window root boom-local/login-report/after-session.png 2>/dev/null || true
          grep -E 'Cache is ready|LOGIN_SCREEN|LOGGING_IN|LOADING|LOGGED_IN|CONNECTION_LOST|HOPPING' boom-local/login-report/client.log | tail -150 > boom-local/login-report/state-summary.txt || true
          grep -E 'LOGIN_|FIRST_WORLD|POST_WORLD|SESSION_' boom-local/login-report/proxy.log > boom-local/login-report/session-summary.txt || true
          grep -n -A18 -B8 'Client error:' boom-local/login-report/client.log > boom-local/login-report/client-error-context.txt || true
          kill $(cat boom-local/login-report/client.pid) 2>/dev/null || true
          kill $(cat boom-local/login-report/proxy.pid) 2>/dev/null || true
          kill $(cat boom-local/login-report/openbox.pid) 2>/dev/null || true
          exit 0

      - name: Print session summary
        if: always()
        run: |
          echo '=== LOCAL SESSION PROXY ==='
          cat boom-local/login-report/session-summary.txt 2>/dev/null | tail -160 || true
          echo '=== CLIENT STATE ==='
          cat boom-local/login-report/state-summary.txt 2>/dev/null || true
          echo '=== CLIENT CRASH ==='
          cat boom-local/login-report/client-error-context.txt 2>/dev/null || true
          echo '=== JVM IOEXCEPTION SITES ==='
          grep -n -B3 -A6 -E 'java\.io\.IOException|osrs\.Client' boom-local/login-report/jvm-exceptions.log 2>/dev/null | tail -160 || true
          if grep -q 'Game state changed: LOGGED_IN' boom-local/login-report/state-summary.txt 2>/dev/null; then
            echo 'LOCAL_WORLD_LOGIN=PASS'
          else
            echo 'LOCAL_WORLD_LOGIN=FAIL'
          fi

      - name: Upload login probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boom-login-probe
          path: boom-local/login-report/**
          retention-days: 3
